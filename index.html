<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="Concept mockup of a multitrack stems player. Not affiliated with or endorsed by Spotify or any artist.">
  <title>Glass Garden · Stems</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <button class="icon-btn" id="backBtn" aria-label="Close multitrack" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5 L8 12 L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#1DB954"/>
          <g fill="#06210f">
            <rect x="6" y="14" width="3.2" height="10" rx="1.6"/>
            <rect x="12.4" y="8" width="3.2" height="16" rx="1.6"/>
            <rect x="18.8" y="11" width="3.2" height="13" rx="1.6"/>
            <rect x="25.2" y="6" width="3.2" height="18" rx="1.6"/>
          </g>
        </svg>
        <div>
          <div class="brand-kicker">Concept</div>
          <div class="brand-name">Stems</div>
        </div>
      </div>
      <div class="load" id="loadLabel">Loading stems…</div>
    </header>

    <section class="stage">
      <div class="art" id="art">
        <svg viewBox="0 0 800 800" role="img" aria-label="Album art for Glass Garden">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#0c3b28"/>
              <stop offset="0.48" stop-color="#10241b"/>
              <stop offset="1" stop-color="#070d0a"/>
            </linearGradient>
            <radialGradient id="glow" cx="28%" cy="18%" r="70%">
              <stop offset="0" stop-color="#1DB954" stop-opacity="0.55"/>
              <stop offset="1" stop-color="#1DB954" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="800" height="800" fill="url(#bg)"/>
          <rect width="800" height="800" fill="url(#glow)"/>
          <g>
            <rect x="78" y="118" width="290" height="450" rx="32" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.16"/>
            <rect x="246" y="196" width="320" height="470" rx="32" fill="#1DB954" fill-opacity="0.13" stroke="#c8ffdf" stroke-opacity="0.28"/>
            <rect x="470" y="132" width="230" height="300" rx="28" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.14"/>
          </g>
          <g fill="none" stroke="#e7fff3" stroke-width="10" stroke-linecap="round">
            <path d="M400 660 C400 540 402 470 400 340"/>
            <path d="M400 520 C320 486 270 430 236 348"/>
            <path d="M400 470 C486 430 540 372 586 286"/>
            <path d="M400 400 C346 352 338 286 366 214"/>
          </g>
          <g fill="#1DB954">
            <ellipse cx="236" cy="338" rx="52" ry="22" transform="rotate(-32 236 338)"/>
            <ellipse cx="586" cy="276" rx="56" ry="22" transform="rotate(30 586 276)"/>
            <ellipse cx="366" cy="206" rx="40" ry="16" transform="rotate(-18 366 206)"/>
          </g>
          <text x="72" y="724" fill="#ffffff" font-family="Inter, Helvetica, sans-serif" font-size="44" font-weight="700" letter-spacing="1.5">GLASS GARDEN</text>
          <text x="72" y="762" fill="#b7f0cf" font-family="Inter, Helvetica, sans-serif" font-size="22" letter-spacing="4">MIRA ELLISON</text>
        </svg>
      </div>
      <div class="titles">
        <h1>Glass Garden</h1>
        <p class="artist">Mira Ellison</p>
        <p class="album">Original demo · 112 BPM · A minor</p>
      </div>
    </section>

    <section class="transport" aria-label="Playback">
      <div class="times">
        <span id="cur">0:00</span>
        <span id="dur">1:11</span>
      </div>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" disabled>
      <div class="buttons">
        <button class="icon-btn" id="restart" aria-label="Restart" disabled>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M6 5h2v14H6zM20 5l-9 7 9 7V5z"/>
          </svg>
        </button>
        <button class="play" id="play" aria-label="Play" disabled>
          <svg id="playIcon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
        <button class="stems-btn" id="stemsBtn" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="1" y="7" width="2.2" height="7" rx="1" fill="currentColor"/>
            <rect x="5" y="3" width="2.2" height="11" rx="1" fill="currentColor"/>
            <rect x="9" y="5" width="2.2" height="9" rx="1" fill="currentColor"/>
            <rect x="13" y="1" width="2.2" height="13" rx="1" fill="currentColor"/>
          </svg>
          Multitrack
        </button>
      </div>
      <p class="mixline" id="mixLine">Artist mix</p>
    </section>

    <section class="mixer" id="mixer" aria-label="Multitrack mix"></section>
    <p class="foot">Stems made available by the artist. Concept mockup — not affiliated with or endorsed by Spotify or any artist.</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
